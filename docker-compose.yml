services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartola-odds-frontend
    image: cartola-odds-frontend:latest
    ports:
      - "${APP_PORT:-4200}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8080}
      # O resolver do nginx não lê /etc/hosts, e é de lá que sai o
      # host.docker.internal posto pelo extra_hosts abaixo. Ligado aqui, o
      # entrypoint fixa o IP daquela entrada na subida — correto porque ela é
      # estática. Produção não define esta variável: lá o destino tem de ser
      # re-resolvido a cada requisição, que é o bug que o proxy corrigiu.
      BACKEND_URL_FROM_ETC_HOSTS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
        reservations:
          memory: 64m
          cpus: "0.1"

