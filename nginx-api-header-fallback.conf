# Fallback dos headers de segurança para as respostas que o próprio nginx
# gera em /api/ (502/504 quando o backend está indisponível, 408 etc.).
#
# Quando o backend responde, ele já enviou o header e o valor mapeado fica
# vazio — o nginx omite add_header de valor vazio, então a resposta sai com
# exatamente um header, o do Spring Security. Sem duplicação nem conflito.
map $upstream_http_x_frame_options $fallback_x_frame_options {
    ''      "SAMEORIGIN";
    default "";
}

map $upstream_http_x_content_type_options $fallback_x_content_type_options {
    ''      "nosniff";
    default "";
}

map $upstream_http_referrer_policy $fallback_referrer_policy {
    ''      "strict-origin-when-cross-origin";
    default "";
}

# ── Esquema original da requisição ────────────────────────────────────────────
# De onde sai o X-Forwarded-Proto repassado ao backend.
#
# Não pode ser `$scheme`: este nginx só tem `listen 80`, então `$scheme` é
# sempre "http". Usá-lo sobrescrevia o "https" que a borda da plataforma
# manda, e o efeito aparecia longe daqui — o RemoteIpValve marcava
# request.isSecure() como falso e o Spring Security calava o
# Strict-Transport-Security, justamente a resposta em que ele deveria sair.
#
# Então o valor da borda é preservado quando existe, e `$scheme` fica como o
# que sempre deveria ter sido: o fallback de quem não está atrás de proxy —
# o desenvolvimento em http://localhost, onde mandar HSTS travaria o
# navegador do desenvolvedor em HTTPS por um ano.
#
# O casamento é por prefixo e só entrega dois valores possíveis, "https" ou
# "http". Isto é deliberado: X-Forwarded-Proto é header que o cliente escreve,
# e aqui ele entra numa decisão de segurança do backend. Qualquer coisa que
# não seja um dos dois esquemas — valor inventado, tentativa de injeção — não
# é repassada: cai no `default` e vale o nosso `$scheme`. O prefixo também
# resolve a cadeia de proxies ("https, http"), onde o primeiro valor é o
# esquema do cliente original. As entradas de regex são avaliadas na ordem
# declarada, por isso "https" vem antes de "http".
#
# O que este map NÃO resolve: confiar no header é confiar em quem o enviou.
# Quem decide isso é o backend, por `server.tomcat.remoteip.internal-proxies`
# — os X-Forwarded-* só valem quando a conexão vem de um proxy da lista.
map $http_x_forwarded_proto $forwarded_proto {
    ~*^https  https;
    ~*^http   http;
    default   $scheme;
}
