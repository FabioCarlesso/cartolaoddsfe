# Headers de segurança compartilhados por todos os locations do SPA.
# Não é incluído em location /api/: essas respostas devem carregar
# apenas os headers que o Spring Security já define.
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
